/* A안 확정 스타일 보강 — 원본 A안의 색/카드/레이아웃 보존 */
:root{color-scheme:light}
body{background:#f6f8fc}
#app{container-type:inline-size;min-width:0;min-height:100vh}
.app-shell{min-height:100vh!important}
.app-main{max-width:1490px;width:100%}
.sidebar{position:sticky;top:0;height:100vh}
.side-footer{margin-top:auto}
.preview-notice{padding:10px 25px;background:#edf4ff;border-bottom:1px solid #dae7f8;color:#4a6d9b;font-size:12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.preview-notice b{font-weight:850}
.preview-notice .notice-right{color:#6280a3;font-size:11px}
.preview-notice strong{font-size:11px}
.toast{max-width:calc(100% - 30px);text-align:center}
.dual-chart{height:184px;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:7px;padding:11px 4px 0;border-bottom:1px solid #e2e9f2;background:repeating-linear-gradient(to top,transparent 0,transparent 37px,#edf1f7 38px,#fff 39px)}
.dual-month{min-width:0;display:flex;align-items:stretch;flex-direction:column;gap:4px}
.dual-bars{height:148px;display:flex;align-items:flex-end;justify-content:center;gap:4px}
.dual-bars span{width:35%;max-width:24px;min-height:0;border-radius:5px 5px 0 0}
.dual-bars .bar-earn{background:#3b83f3}
.dual-bars .bar-exp{background:#a5caef}
.dual-month.selected .bar-earn{background:#2565df;box-shadow:0 0 0 2px #e7f0ff}
.dual-label{border:0;background:transparent;color:#95a4b6;font-size:10px;text-align:center;padding:6px 1px;border-radius:6px;cursor:pointer}
.dual-month.selected .dual-label{background:#e7f1ff;color:#276ed2;font-weight:900}
.dual-label:hover{background:#f1f5fb}
.empty-record{text-align:center;padding:27px 12px;color:#8998aa}
.empty-record strong{display:block;font-size:13px;color:#506785;margin:7px 0 5px}
.empty-record p{font-size:11px;line-height:1.7}
.empty-icon{font-size:28px}
.record-table .amount.plus{color:#149787}
